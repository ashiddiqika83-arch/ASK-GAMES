<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ASK GAMES v6.1 Offline</title>
<style>body{margin:0;font-family:Arial;background:linear-gradient(#87ceeb,#6eb7ff)}#ui{position:fixed;left:12px;top:12px;background:#efe8d5;padding:12px;border:2px solid #7c5f3b;border-radius:6px;width:360px}button{background:#7c5f3b;color:white;border:none;padding:8px 12px;border-radius:4px;margin:4px}canvas{display:block;width:100vw;height:100vh}#skinPreview img{image-rendering:pixelated;border:2px solid #7c5f3b;margin-right:6px}</style></head><body>
<div id="ui"><div style="font-weight:900">ASK GAMES — Minecraft Runner v6.1</div><div style="margin-top:8px"><button id="playBtn">Play</button><button id="openLeaderboard" style="background:transparent;border:2px solid #7c5f3b">Leaderboard</button></div><div style="margin-top:8px"><label style="background:transparent;border:2px solid #7c5f3b;padding:6px;display:inline-block;cursor:pointer">Upload Skin<input id="skinFile" type="file" accept="image/png" style="display:none"/></label><button id="useDefault" style="background:transparent;border:2px solid #7c5f3b">Default Skins</button><button id="musicToggle" style="margin-left:6px">Music On</button></div><div id="skinPreview" style="margin-top:8px">Default skins below</div><div id="status" style="margin-top:8px;font-weight:700">Status: Ready (offline)</div></div>
<div id="leaderboard" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff7ea;padding:12px;border:2px solid #7c5f3b;border-radius:8px"><div style="font-weight:800">Leaderboard (Local)</div><div id="lbList" style="max-height:300px;overflow:auto;margin-top:8px"></div><div style="margin-top:8px"><button id="closeLb" style="background:transparent;border:2px solid #7c5f3b">Close</button><button id="clearLb" style="background:transparent;border:2px solid #7c5f3b">Clear</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<script>
const AS='assets/'; const LS_SKIN='askgames_v6_skin'; const LS_LB='askgames_v6_lb'; let audioCtx=null,audioBuf={}; async function loadS(n,u){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const r=await fetch(u); const ab=await r.arrayBuffer(); audioBuf[n]=await audioCtx.decodeAudioData(ab);}catch(e){console.warn('audio',n,e);} } function playS(n,loop=false){ if(!audioBuf[n]||!audioCtx) return null; const s=audioCtx.createBufferSource(); s.buffer=audioBuf[n]; s.loop=loop; const g=audioCtx.createGain(); g.gain.value=0.7; s.connect(g); g.connect(audioCtx.destination); s.start(); return s; }
document.getElementById('useDefault').addEventListener('click', ()=>{ const cont=document.getElementById('skinPreview'); cont.innerHTML=''; const s=document.createElement('img'); s.src=AS+'steve.png'; s.width=64;s.height=64; s.onclick=()=>{ localStorage.setItem(LS_SKIN,s.src); alert('Steve selected'); }; const a=document.createElement('img'); a.src=AS+'alex.png'; a.width=64;a.height=64; a.onclick=()=>{ localStorage.setItem(LS_SKIN,a.src); alert('Alex selected'); }; cont.appendChild(s); cont.appendChild(a); });
document.getElementById('skinFile').addEventListener('change', (e)=>{ const f=e.target.files[0]; if(!f) return; const url=URL.createObjectURL(f); const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=64; const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false; ctx.drawImage(img,0,0,64,64); const d=c.toDataURL(); localStorage.setItem(LS_SKIN,d); document.getElementById('skinPreview').innerHTML='<img src="'+d+'" width=64 height=64/>'; URL.revokeObjectURL(url); }; img.src=url; });
document.getElementById('openLeaderboard').addEventListener('click', ()=>{ const raw=localStorage.getItem(LS_LB)||'[]'; const arr=JSON.parse(raw); const el=document.getElementById('lbList'); el.innerHTML=''; if(arr.length===0) el.textContent='No scores yet'; else arr.forEach((r,i)=>{ const d=document.createElement('div'); d.textContent=(i+1)+'. '+r.name+' - '+r.time.toFixed(2)+'s'; d.style.padding='6px'; el.appendChild(d); }); document.getElementById('leaderboard').style.display='block'; }); document.getElementById('closeLb').addEventListener('click', ()=>document.getElementById('leaderboard').style.display='none'); document.getElementById('clearLb').addEventListener('click', ()=>{ localStorage.removeItem(LS_LB); document.getElementById('lbList').innerHTML=''; });

function webglAvailable(){ try{ const c=document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl')));}catch(e){return false;} }
let renderer,scene,camera,player={group:null,parts:{},pos:new THREE.Vector3(),vel:new THREE.Vector3(),onGround:false},blocks=[],enemies=[],checkpoints=[]; let last=performance.now();
function buildPlayer(){ const g=new THREE.Group(); const head=new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({color:0xf1c27d})); head.position.set(0,1.6,0); g.add(head); const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,0.5), new THREE.MeshStandardMaterial({color:0x2563eb})); body.position.set(0,0.6,0); g.add(body); const armL=new THREE.Mesh(new THREE.BoxGeometry(0.3,1.2,0.3), new THREE.MeshStandardMaterial({color:0x2563eb})); armL.position.set(-0.75,0.6,0); g.add(armL); const armR=armL.clone(); armR.position.set(0.75,0.6,0); g.add(armR); const legL=new THREE.Mesh(new THREE.BoxGeometry(0.35,1.0,0.35), new THREE.MeshStandardMaterial({color:0x111827})); legL.position.set(-0.2,-0.9,0); g.add(legL); const legR=legL.clone(); legR.position.set(0.2,-0.9,0); g.add(legR); player.group=g; player.parts={head,body,armL,armR,legL,legR}; scene.add(g); }
function applySkin(img){ const c=document.createElement('canvas'); c.width=c.height=64; const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false; ctx.drawImage(img,0,0,64,64); function ex(sx,sy,w,h,sz){ const o=document.createElement('canvas'); o.width=sz; o.height=Math.round(sz*(h/w)); const oc=o.getContext('2d'); oc.imageSmoothingEnabled=false; oc.drawImage(c,sx,sy,w,h,0,0,o.width,o.height); return new THREE.CanvasTexture(o);} player.parts.head.material.map=ex(8,8,8,8,128); player.parts.body.material.map=ex(20,20,8,12,160); player.parts.armL.material.map=ex(44,20,4,12,64); player.parts.armR.material.map=ex(44,20,4,12,64); player.parts.legL.material.map=ex(4,20,4,12,64); player.parts.legR.material.map=ex(4,20,4,12,64); }
function loadSavedSkin(){ const d=localStorage.getItem(LS_SKIN); if(!d) return false; const img=new Image(); img.onload=()=>applySkin(img); img.src=d; return true; }
async function initScene(){ if(!webglAvailable()){ alert('WebGL not available'); return; } renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(window.innerWidth,window.innerHeight); document.body.appendChild(renderer.domElement); window.addEventListener('resize', ()=>{ renderer.setSize(window.innerWidth,window.innerHeight); camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); }); scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,2000); camera.position.set(0,8,14); scene.add(new THREE.HemisphereLight(0xbfe3ff,0x202020,1)); const dir=new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(5,10,2); scene.add(dir); const grass=new THREE.TextureLoader().load(AS+'grass.png'); grass.wrapS=grass.wrapT=THREE.RepeatWrapping; grass.repeat.set(80,80); const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshStandardMaterial({map:grass})); ground.rotation.x=-Math.PI/2; ground.position.y=-1; scene.add(ground); for(let i=0;i<60;i++){ const b=new THREE.Mesh(new THREE.BoxGeometry(1.9,1.9,1.9), new THREE.MeshStandardMaterial({color:(i%7===0)?0x7f7f7f:0x3b8b3b})); b.position.set(i*2,0,0); scene.add(b); blocks.push(b);} const cp=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2), new THREE.MeshStandardMaterial({color:0xffcc66,emissive:0xffcc66})); cp.position.set(48*2,1,0); scene.add(cp); checkpoints.push({mesh:cp,bbox:{min:new THREE.Vector3(cp.position.x-0.6,0,cp.position.z-0.6),max:new THREE.Vector3(cp.position.x+0.6,2,cp.position.z+0.6)}}); const e=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5), new THREE.MeshStandardMaterial({color:0xa33a3a})); e.position.set(30*2,1,0); scene.add(e); enemies.push({mesh:e,startX:e.position.x,range:6*2,speed:2,dir:1,bbox:{min:new THREE.Vector3(e.position.x-0.75,0,e.position.z-0.75),max:new THREE.Vector3(e.position.x+0.75,2,e.position.z+0.75)}}); buildPlayer(); player.pos.set(2,2,0); player.group.position.copy(player.pos); loadSavedSkin(); animate(); }
function animate(t){ const dt=Math.min((t-last)/1000,0.05); last=t; player.vel.y+=-30*dt; if(keys['ArrowLeft']||keys['KeyA']) player.pos.x-=6*dt; if(keys['ArrowRight']||keys['KeyD']) player.pos.x+=6*dt; if((keys['Space']||keys['KeyW']||keys['ArrowUp']) && player.onGround){ player.vel.y=12; player.onGround=false; if(audioCtx) playS('jump'); } player.pos.y+=player.vel.y*dt; if(player.pos.y<1.1){ player.pos.y=1.1; player.vel.y=0; player.onGround=true; } player.group.position.copy(player.pos); enemies.forEach(e=>{ e.mesh.position.x+=e.speed*e.dir*dt; if(e.mesh.position.x>e.startX+e.range/2) e.dir=-1; if(e.mesh.position.x<e.startX-e.range/2) e.dir=1; const pmin=new THREE.Vector3(player.pos.x-0.45,player.pos.y-0.9,player.pos.z-0.45); const pmax=new THREE.Vector3(player.pos.x+0.45,player.pos.y+0.9,player.pos.z+0.45); if(!(pmax.x < e.bbox.min.x || pmin.x > e.bbox.max.x || pmax.y < e.bbox.min.y || pmin.y > e.bbox.max.y)){ player.pos.set(2,2,0); player.vel.set(0,0,0); player.group.position.copy(player.pos); if(audioCtx) playS('damage'); } }); const cp=checkpoints[0]; if(cp){ const pmin=new THREE.Vector3(player.pos.x-0.45,player.pos.y-0.9,player.pos.z-0.45); const pmax=new THREE.Vector3(player.pos.x+0.45,player.pos.y+0.9,player.pos.z+0.45); if(!(pmax.x < cp.bbox.min.x || pmin.x > cp.bbox.max.x || pmax.y < cp.bbox.min.y || pmin.y > cp.bbox.max.y)){ const time=(performance.now()-levelStart)/1000.0; const name=prompt('Level complete! Enter name','Player')||'Player'; const raw=localStorage.getItem(LS_LB)||'[]'; const arr=JSON.parse(raw); arr.push({name:name.substring(0,16),level:1,time:time,date:Date.now()}); arr.sort((a,b)=>a.time-b.time); localStorage.setItem(LS_LB,JSON.stringify(arr.slice(0,100))); alert('Saved: '+time.toFixed(2)+'s'); cp.mesh.position.x+=10000; if(audioCtx) playS('checkpoint'); } } const ideal=new THREE.Vector3(player.pos.x,player.pos.y+6,player.pos.z+12); camera.position.lerp(ideal,0.08); camera.lookAt(player.pos.x,player.pos.y+1,player.pos.z); renderer.render(scene,camera); requestAnimationFrame(animate); }
let keys={}; window.addEventListener('keydown',e=>keys[e.code]=true); window.addEventListener('keyup',e=>keys[e.code]=false);
let levelStart=0; document.getElementById('playBtn').addEventListener('click', async ()=>{ if(!webglAvailable()){ alert('WebGL not available'); return; } if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); await loadS('ambient',AS+'ambient.wav'); await loadS('jump',AS+'jump.wav'); await loadS('checkpoint',AS+'checkpoint.wav'); await loadS('damage',AS+'damage.wav'); const musicBtn=document.getElementById('musicToggle'); let musicOn=true; musicBtn.addEventListener('click', ()=>{ musicOn=!musicOn; musicBtn.textContent = musicOn ? 'Music On' : 'Music Off'; if(musicOn) playS('ambient',true); else { try{ audioCtx.close(); audioCtx=null; }catch(e){} } }); if(musicOn) playS('ambient',true); document.getElementById('ui').remove(); levelStart=performance.now(); initScene(); });
</script></body></html>
